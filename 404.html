<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 — REPLAY DJ School</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100svh;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(60% 50% at 50% 30%,rgba(255,138,61,.25),transparent 70%),#0a0a0a;color:#f5f5f2;font:500 18px Inter,sans-serif}
h1{font:800 clamp(80px,22vw,200px)/1 Unbounded,sans-serif;color:#E8C93E}
p{color:#a3a3a0;margin:16px 0 32px}
a{display:inline-flex;height:52px;align-items:center;padding:0 28px;border-radius:999px;background:#E8C93E;color:#000;font:800 13px Unbounded,sans-serif;text-transform:uppercase;text-decoration:none}
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>Цей трек не знайдено. Давай на головну.</p>
  <a id="home" href="./">На головну</a>
</main>
<script>
// на github.io/<repo>/ 404 віддається з будь-якої глибини, тому ведемо на корінь сайту
var p=location.pathname.split('/');var base=location.hostname.endsWith('github.io')&&p[1]?'/'+p[1]+'/':'/';
document.getElementById('home').href=base;
</script>
</body>
</html>
